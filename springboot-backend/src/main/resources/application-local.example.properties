# Copy these values to environment variables or an untracked local profile.
# Never commit real passwords or production secrets.
spring.datasource.url=jdbc:mysql://localhost:3306/quanzhou_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=replace-with-your-local-password

# Use a random secret of at least 32 bytes.
jwt.secret=replace-with-a-random-secret-at-least-32-bytes
jwt.expiration=86400000

ollama.base-url=http://localhost:11434
ollama.model=deepseek-r1:1.5b
ollama.connect-timeout-ms=5000
ollama.read-timeout-ms=60000

app.cors.allowed-origins=http://localhost:3000
logging.level.com.quanzhou.mall=INFO
