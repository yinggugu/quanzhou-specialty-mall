# Spring Boot 应用配置
server.port=8088

# MySQL 数据源配置（敏感值通过环境变量注入）
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/quanzhou_mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.quanzhou.mall.bean
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

# JWT 配置
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Ollama AI 客服配置
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:deepseek-r1:1.5b}
ollama.connect-timeout-ms=${OLLAMA_CONNECT_TIMEOUT_MS:5000}
ollama.read-timeout-ms=${OLLAMA_READ_TIMEOUT_MS:60000}

# 前端跨域白名单，多个地址使用逗号分隔
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 日志配置
logging.level.com.quanzhou.mall=${APP_LOG_LEVEL:INFO}
